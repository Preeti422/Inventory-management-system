{% extends "base.html" %}

{% block title %}Customers{% endblock %}

{% block content %}
<h1>Orders</h1>

    <a href="/">Home</a>
    <h2>Add Order</h2>
    <form method="POST">
        
        <label>Customer ID:</label>
        <input type="number" name="customer_id" required>
        <br><br>

        <label>Order Date:</label>
        <input type="date" name="order_date" required>
        <br><br>

        <button type="submit">Add Order</button>
    </form>
    <table>
        <tr>
        <th>Order  ID</th>
        <th>Customer ID</th>
        <th>Order Date</th>
        <th>Total Amount</th>
        <th>Action</th>
    </tr>

    {% for order in orders %}
    <tr>
        <td>{{ order[0] }}</td>
        <td>{{ order[1] }}</td>
        <td>{{ order[2] }}</td>
        <td>{{ order[3] }}</td>

        <td class="action">

            <a href="/edit_order/{{ order[0] }}">Edit</a>
            <form method="POST"
                  action="/delete_order/{{ order[0] }}"
                  style="display:inline;">

                <button type="submit">Delete</button>

            </form>
        </td>
    </tr>
    {% endfor %}
</table>
    
{% endblock %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Inventory Management{% endblock %}</title>
    <style>
        body{
            font-family: Aerial, sans-serif;
            background-color: #f5f6fa;
            margin: 0;
            padding: 30px;
        
        }

        h1 {
            text-align: center;
        }

        table {
            width: 90%;
            margin: 30px auto;
            border-collapse: collapse;
            background-color: white;
        }

        th {
            background-color: #222;
            color: white;
            padding: 12px;
        }

        td {
            padding: 10px;
            text-align: center;
            border: 1px solid #ddd;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: #e8e8e8;
        }

        button {
            padding: 7px 12px;
            cursor: pointer;
        }

        a {
            text-decoration: none;
        }

        .action {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        input {
            padding: 8px;
            margin: 5px;
        }

        .container {
            width: 90%;
            margin: auto;
        }

        .login-container {
            min-height: 70vh;
            display: flex;
            justify-content: center;
            align-items: center;
            }
        
        .login-box {

           width: 350px;
           background: white;
           padding: 35px;
           border-radius: 12px;
           box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .login-box h1 {
           margin-bottom: 5px;
           text-align: center;
        }

        .subtitle {

           text-align: center;
           color: #666;
           margin-bottom: 25px;
        }

        .form-group {
           margin-bottom: 18px;
        }

        .form-group label {
          display: block;
          margin-bottom: 6px;
          font-weight: bold;
         }

        .form-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .login-box button {
           width: 100%;
           padding: 11px;
           border: none;
           border-radius: 6px;
           background-color: #222;
           color: white;
           font-size: 16px;
           cursor: pointer;
        }

        .login-box button:hover {
           background-color: #444;
        }

        .error {
           text-align: center;
           color: #d00;
           background-color: #ffe5e5;
           padding: 8px;
           border-radius: 5px;
         }  
    


    </style>
</head>

<body>

    {% block content %}
    {% endblock %}

</head>

    
</body>
</html>

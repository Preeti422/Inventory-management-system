<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Inventory Management{% endblock %}</title>
    <style>
        body{
            font-family: Aerial, sans-serif;
            background-color: #f5f6fa;
            margin: 0;
            padding: 30px;
        
        }

        h1 {
            text-align: center;
        }

        table {
            width: 90%;
            margin: 30px auto;
            border-collapse: collapse;
            background-color: white;
        }

        th {
            background-color: #222;
            color: white;
            padding: 12px;
        }

        td {
            padding: 10px;
            text-align: center;
            border: 1px solid #ddd;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: #e8e8e8;
        }

        button {
            padding: 7px 12px;
            cursor: pointer;
        }

        a {
            text-decoration: none;
        }

        .action {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        input {
            padding: 8px;
            margin: 5px;
        }

        .container {
            width: 90%;
            margin: auto;
        }
    </style>
</head>

<body>

    {% block content %}
    {% endblock %}

</head>

    
</body>
</html>

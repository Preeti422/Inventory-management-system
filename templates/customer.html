{% extends "base.html" %}

{% block title %}Customers{% endblock %}

{% block content %}

<h1>Customers</h1>

<form method="POST">

    <label>Name:</label>
    <input type="text" name="name" required>
    <br><br>

    <label>Email:</label>
    <input type="email" name="email" required>
    <br><br>

    <label>Phone:</label>
    <input type="text" name="phone" required>
    <br><br>

    <label>City:</label>
    <input type="text" name="city" required>
    <br><br>

    <label>Password:</label>
    <input type="password" name="password" required>
    <br><br>

    <button type="submit">Add Customer</button>

</form>

<table>

    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>City</th>
        <th>Action</th>
    </tr>

    {% for customer in customers %}

    <tr>

        <td>{{ customer[0] }}</td>
        <td>{{ customer[1] }}</td>
        <td>{{ customer[2] }}</td>
        <td>{{ customer[3] }}</td>
        <td>{{ customer[4] }}</td>

        <td class="action">

            <a href="/update_customer/{{ customer[0] }}">
                Edit
            </a>

            <form method="POST"
                  action="/delete_customer/{{ customer[0] }}"
                  style="display:inline;"
                  onsubmit="return confirm('Are you sure you want to delete this customer?');">

                <button type="submit">Delete</button>

            </form>

        </td>

    </tr>

    {% endfor %}

</table>

{% endblock %}

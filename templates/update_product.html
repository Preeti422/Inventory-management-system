<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Product</title>
    <style>
        body {
        font-family: Arial, sans-serif;
        background-color: #f5f6fa;
        margin: 0;
        padding: 30px;
    }

    h1 {
        text-align: center;
        margin-bottom: 30px;
    }

    form {
        width: 500px;
        max-width: 90%;
        margin: 30px auto;
        padding: 25px;
        background-color: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    label {
        display: inline-block;
        width: 100px;
        margin-bottom: 15px;
    }

    input {
        padding: 9px;
        width: 250px;
        border: 1px solid #ccc;
        border-radius: 5px;
        margin-bottom: 10px;
    }

    button {
        padding: 9px 16px;
        cursor: pointer;
        border: none;
        border-radius: 5px;
        background-color: #222;
        color: white;
        margin-top: 10px;
    }

    button:hover {
        background-color: #444;
    }

    a {
        text-decoration: none;
        color: #3498db;
    }

    .back {
        display: block;
        width: 500px;
        max-width: 90%;
        margin: 0 auto;
    }


    </style>
</head>
<body>
    <h1>Update Product</h1>
    <a class="back" href="/products">Back to Products</a>
    <br><br>

    <form method="POST">
        <label>Product Name:</label>
        <input type="text" name="product_name" value="{{ product[1] }}" required>
        <br><br>

        <label>Price:</label>
        <input type="number" step="0.01" name="price" value="{{ product[2] }}" required>
        <br><br>

        <label>Stock:</label>
        <input type="number"
               name="stock"
               value="{{ product[3] }}"
               required>

        <br><br>

        <label>Category ID:</label>
        <input type="number"
               name="category_id"
               value="{{ product[4] }}"
               required>

        <br><br>

        <button type="submit">Update Product</button>

        
    </form>

    
</body>
</html>
